<div class="para" id="fig-projection-line-c-2-2-2-1">This diagram contains most of the same key features as the previous diagram.  There is a vector <span class="process-math">\(\wvec\)</span> that defines the line <span class="process-math">\(L\text{,}\)</span> a vector <span class="process-math">\(\bvec\)</span> not on line, and the orthogonal projection of <span class="process-math">\(\bvec\)</span> onto <span class="process-math">\(L\text{.}\)</span>  The key difference is that the orthogonal projection <span class="process-math">\(\bhat\)</span> is written as <span class="process-math">\(s\wvec\text{,}\)</span> a scalar multiple of <span class="process-math">\(\wvec\text{.}\)</span>  In this way, the vector <span class="process-math">\(\bvec-\bhat = \bvec-s\wvec\)</span> is orthogonal to <span class="process-math">\(L\text{,}\)</span> which provides a means of finding <span class="process-math">\(s\)</span> and hence <span class="process-math">\(\bhat\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-projection-line-c-2-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

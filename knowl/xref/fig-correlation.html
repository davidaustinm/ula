<div class="para" id="fig-correlation-2-1-2-1">A representation of two time series where each time series is shown as a set of plotted points.  There is a set of axes with tick marks on the horizontal axis representing time values <span class="process-math">\(1\text{,}\)</span> <span class="process-math">\(2\text{,}\)</span> <span class="process-math">\(3\text{,}\)</span> and so on.  The components of each time series determine the vertical coordinates of the plotted points and each component is one time unit to the right of the preceeding component.  Adjacent points are connected by line segments, which gives the time series the appearance of the graph of a function.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-correlation-2-1-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="fig-correlation-2-1-2-2">The two time series in this diagram roughly rise and fall at the same time as one another, which is why they are positively correlated.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-correlation-2-1-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</div></details>

<details class="image-description" aria-live="polite"><summary title="details"><span class="icon material-symbols-outlined" aria-hidden="true">&#xe88e;</span></summary><div id="fig-correlation-2-2-description">
<div class="para" id="fig-correlation-2-2-2-1">Two time series are represented in the same manner as the previous diagram.  In this diagram, however, when one of the time series rises, the other falls and vice versa.  This is why the time series are negatively correlated.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-correlation-2-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<span class="type">Proposition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.1.13</span><span class="period heading-divison-mark heading-divison-mark__period">.</span>
</h2>
<div class="para logical">
<div class="para">For any matrix <span class="process-math">\(A\text{,}\)</span> we have</div>
<div class="displaymath process-math">
\begin{equation*}
\vvec\cdot(A\wvec) = (A^T\vvec)\cdot\wvec.
\end{equation*}
</div>
<div class="para">In particular, if <span class="process-math">\(A\)</span> is symmetric, then</div>
<div class="displaymath process-math">
\begin{equation*}
\vvec\cdot(A\wvec) = (A\vvec)\cdot\wvec.
\end{equation*}
</div>
